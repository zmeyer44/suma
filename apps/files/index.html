<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      This page is served from the privileged suma://files scheme, so it may
      not reach the network at all: everything it shows arrives through the
      preload bridge. `connect-src 'self'` exists only so a standalone
      `vite dev` can keep its HMR socket; the built page makes no requests.
      The main process is expected to send an equivalent CSP header, which is
      the enforcing copy — this meta tag is defence in depth.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suma Files</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

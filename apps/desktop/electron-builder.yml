# Packaging for the macOS DMG (PRD: macOS 14+, Apple Silicon).
#
# This base config builds UNSIGNED — `dist:mac` sets
# CSC_IDENTITY_AUTO_DISCOVERY=false so a dev build never picks up whatever
# certificate happens to be in the keychain. Signed + notarized releases go
# through electron-builder.prod.yml (`dist:mac:prod`, runbook in
# docs/release-macos.md), and additionally need the castLabs ECS Electron for
# Widevine/VMP (see package.json description) — this config packages whatever
# `electron` resolves to in node_modules.
appId: com.sumabrowser.app
productName: Suma

directories:
  buildResources: build
  output: dist

# Main/preload/renderer are already bundled into out/ by electron-vite;
# externalized runtime deps (ai, node-pty, nostr-tools, tldts) are picked up
# from node_modules automatically.
files:
  - out/**
  - "!out/**/*.map"

# The bundle icon follows the macOS icon grid, which reserves an outer safe
# area. The running app uses this full-bleed raster for its Dock slot so the
# production footprint matches development; both derive from icon.svg.
extraResources:
  - from: build/icon.png
    to: icon.png

# node-pty ships a native addon and a spawn-helper binary that must live on
# the real filesystem, not inside the asar; sherpa-onnx (the voice
# assistant's on-device wake word) ships a native addon + dylibs the same way.
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-darwin-arm64/**"

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  minimumSystemVersion: "14.0.0"
  # DMG is what people download; ZIP is what the auto-updater consumes
  # (Squirrel.Mac updates from a zip archive, never a dmg). Both must ship
  # every release or electron-updater's latest-mac.yml has nothing to point at.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

# Where released builds live and where running apps look for updates
# (main/updates/update-service.ts). electron-builder bakes this into the
# packaged app as app-update.yml and, on `--publish always`, uploads the
# artifacts + latest-mac.yml to the zmeyer44/suma GitHub release for the
# version being built (repo is public, so the update feed needs no token).
# Runbook: docs/release-macos.md §5.
publish:
  provider: github
  owner: zmeyer44
  repo: suma

dmg:
  # build/background.png (660x400) + background@2x.png — dmg-builder folds the
  # pair into one HiDPI tiff. Regenerate with scripts/generate-dmg-background.mjs.
  background: build/background.png
  iconSize: 128
  window:
    width: 660
    height: 400
  # Icon centers, origin top-left: app over the arrow's tail, Applications
  # alias past its head.
  contents:
    - x: 170
      y: 200
      type: file
    - x: 490
      y: 200
      type: link
      path: /Applications
